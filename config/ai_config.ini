[openai]
# OpenAI接口配置
# API密钥优先从环境变量OPENAI_API_KEY读取，如果环境变量不存在则使用下面的配置
api_key = sk-1234567890
# 支持本地OpenAI接口，默认使用本地服务
base_url = http://localhost:8000
# 使用的模型
model = gpt-3.5-turbo
# 生成参数
temperature = 0.7
max_tokens = 2000
timeout = 30

[generation]
# 生成策略配置
positive_cases_count = 3
negative_cases_count = 2
boundary_cases_count = 2
structure_cases_count = 1
path_cases_count = 2
include_auth_cases = true

[prompts]
# 提示词模板配置
system_prompt = 你是一个专业的API测试工程师，需要根据接口文档生成全面的测试用例。请严格按照指定的JSON格式返回测试用例数据。
positive_template = 为以下接口生成正向测试用例，确保正常场景下的功能验证
negative_template = 为以下接口生成反向测试用例，包括参数错误、权限不足等异常场景
boundary_template = 为以下接口生成边界测试用例，包括最大值、最小值、空值等边界条件

[output]
# 输出配置
default_output_dir = data/ai_generated
add_timestamp = true
file_prefix = ai_
quality_check = true
# 文件冲突处理：ask(询问用户), overwrite(覆盖), append(追加), rename(重命名)
conflict_resolution = ask