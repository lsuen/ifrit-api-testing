{% extends "base.html" %}
{% block title %}AI 实验室{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title"><i class="bi bi-stars"></i> AI 实验室</h1>
    <p class="page-desc">从 Swagger / Apifox 文档生成用例 · 支持 URL 拉取与交互模式 (--chat)</p>
</div>

<ul class="nav nav-tabs mb-4" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabGenerate">一键生成</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabChat">交互模式</button></li>
</ul>

<div class="tab-content">
    <div class="tab-pane fade show active" id="tabGenerate">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card-panel">
                    <div class="card-header">生成配置</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">文档来源</label>
                            <select class="form-select" id="docSource">
                                <option value="local">本地文档</option>
                                <option value="url">远程 URL</option>
                            </select>
                        </div>
                        <div class="mb-3" id="localDocGroup">
                            <label class="form-label">本地 API 文档</label>
                            <select class="form-select" id="docSelect">
                                <option value="">-- 选择 --</option>
                                {% for doc in docs %}
                                <option value="{{ doc.relative }}">{{ doc.relative }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3" id="urlDocGroup" style="display:none;">
                            <label class="form-label">文档 URL</label>
                            <input type="url" class="form-control" id="docUrl" placeholder="http://.../apispec_1.json 或 Apifox MD 链接">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">端点过滤（可选，每行一个）</label>
                            <textarea class="form-control" id="endpoints" rows="2" placeholder="/api/address">/api/address</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Skill</label>
                            <select class="form-select" id="skillSelect">
                                <option value="">自动（URL 用 doc_url_generation）</option>
                                <option value="case_generation">case_generation</option>
                                <option value="doc_url_generation">doc_url_generation</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">输出格式</label>
                            <select class="form-select" id="formatSelect">
                                <option value="csv">CSV</option>
                                <option value="json">JSON</option>
                                <option value="excel">Excel</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">输出目录</label>
                            <input type="text" class="form-control" id="outputDir" value="fixtures/ai/csv">
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="runAfterGenerate">
                            <label class="form-check-label">生成后立即执行（全局鉴权）</label>
                        </div>
                        <button class="btn-ifrit btn-primary-ifrit w-100 justify-content-center" id="generateBtn">
                            <i class="bi bi-stars"></i> 开始生成
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card-panel">
                    <div class="card-header">生成日志</div>
                    <div class="card-body">
                        <div class="log-terminal" id="genLog"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tab-pane fade" id="tabChat">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card-panel">
                    <div class="card-header">交互命令</div>
                    <div class="card-body">
                        <p class="small text-muted">等效于 <code>python main.py --chat</code>，按顺序发送命令：</p>
                        <div class="mb-2">
                            <button type="button" class="btn-ifrit btn-secondary-ifrit w-100 mb-2 chat-cmd" data-cmd="doc api_docs/apispec_1.json">doc 本地 Swagger</button>
                            <button type="button" class="btn-ifrit btn-secondary-ifrit w-100 mb-2 chat-cmd" data-cmd="url http://192.168.31.129:5000/apispec_1.json">url 内网 Swagger</button>
                            <button type="button" class="btn-ifrit btn-secondary-ifrit w-100 mb-2 chat-cmd" data-cmd="endpoint /api/address">endpoint 过滤</button>
                            <button type="button" class="btn-ifrit btn-secondary-ifrit w-100 mb-2 chat-cmd" data-cmd="out fixtures/ai/csv">out 输出目录</button>
                        </div>
                        <label class="form-label">命令队列（空格分隔）</label>
                        <textarea class="form-control mb-3" id="chatCommands" rows="4">doc api_docs/apispec_1.json endpoint /api/address out fixtures/ai/csv generate</textarea>
                        <button class="btn-ifrit btn-primary-ifrit w-100 justify-content-center" id="chatRunBtn">
                            <i class="bi bi-chat-dots"></i> 执行交互命令
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card-panel">
                    <div class="card-header">交互日志</div>
                    <div class="card-body">
                        <div class="log-terminal" id="chatLog"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('docSource').addEventListener('change', function() {
    const isUrl = this.value === 'url';
    document.getElementById('localDocGroup').style.display = isUrl ? 'none' : 'block';
    document.getElementById('urlDocGroup').style.display = isUrl ? 'block' : 'none';
});

document.getElementById('generateBtn').addEventListener('click', async () => {
    const source = document.getElementById('docSource').value;
    const payload = {
        format: document.getElementById('formatSelect').value,
        output_dir: document.getElementById('outputDir').value,
        skill: document.getElementById('skillSelect').value || undefined,
        endpoints: document.getElementById('endpoints').value.split('\n').filter(Boolean),
    };
    if (source === 'url') {
        payload.input_url = document.getElementById('docUrl').value.trim();
        if (!payload.input_url) return alert('请输入 URL');
    } else {
        payload.input_doc = document.getElementById('docSelect').value;
        if (!payload.input_doc) return alert('请选择文档');
    }

    document.getElementById('generateBtn').disabled = true;
    const logEl = document.getElementById('genLog');
    logEl.innerHTML = '';

    try {
        const res = await axios.post('/api/ai/generate', payload);
        IfritUI.streamLogs(res.data.process_id, logEl, async (status) => {
            document.getElementById('generateBtn').disabled = false;
            if (status.status === 'completed' && document.getElementById('runAfterGenerate').checked) {
                const runRes = await axios.post('/api/execute', {
                    params: { suite: 'ai', global_auth: true, generate_report: true, type: 'csv' }
                });
                IfritUI.streamLogs(runRes.data.process_id, logEl);
            }
        });
    } catch (e) {
        alert(e.response?.data?.error || e.message);
        document.getElementById('generateBtn').disabled = false;
    }
});

document.querySelectorAll('.chat-cmd').forEach(btn => {
    btn.addEventListener('click', () => {
        const ta = document.getElementById('chatCommands');
        ta.value = (ta.value.trim() + ' ' + btn.dataset.cmd).trim();
    });
});

document.getElementById('chatRunBtn').addEventListener('click', async () => {
    const commands = document.getElementById('chatCommands').value.trim().split(/\s+/);
    if (!commands.length) return alert('请输入命令');
    document.getElementById('chatRunBtn').disabled = true;
    const logEl = document.getElementById('chatLog');
    logEl.innerHTML = '';
    try {
        const res = await axios.post('/api/ai/chat', { commands });
        IfritUI.streamLogs(res.data.process_id, logEl, () => {
            document.getElementById('chatRunBtn').disabled = false;
        });
    } catch (e) {
        alert(e.response?.data?.error || e.message);
        document.getElementById('chatRunBtn').disabled = false;
    }
});
</script>
{% endblock %}
