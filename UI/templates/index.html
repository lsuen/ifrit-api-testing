<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ifrit-apitest - 文件管理器</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <!-- 顶部栏 -->
    <header class="header">
        <div class="header-left">
            <h1>ifrit-apitest 文件管理器</h1>
        </div>
        <div class="header-right">
            <span class="status" id="appStatus">就绪</span>
        </div>
    </header>

    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 左侧面板 -->
        <aside class="sidebar">
            <!-- 目录选择 -->
            <div class="dir-selector">
                <label>选择目录：</label>
                <select id="dirSelect">
                    <option value="fixtures">测试用例 (fixtures)</option>
                    <option value="reports_html">HTML报告 (reports/html)</option>
                    <option value="logs">日志 (logs)</option>
                    <option value="api_docs">API文档 (api_docs)</option>
                    <option value="config">配置 (config)</option>
                </select>
                <button id="refreshBtn" class="btn btn-sm">刷新</button>
            </div>

            <!-- 文件树 -->
            <div class="file-tree" id="fileTree">
                <div class="tree-loading">加载中...</div>
            </div>
        </aside>

        <!-- 右侧编辑区 -->
        <main class="editor-area">
            <!-- 文件信息栏 -->
            <div class="file-info" id="fileInfo">
                <div class="info-row">
                    <span class="info-label">文件：</span>
                    <span class="info-value" id="fileName">未选择文件</span>
                </div>
                <div class="info-row">
                    <span class="info-label">路径：</span>
                    <span class="info-value" id="filePath">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">大小：</span>
                    <span class="info-value" id="fileSize">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">修改：</span>
                    <span class="info-value" id="fileModified">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">状态：</span>
                    <span class="info-value" id="fileStatus">-</span>
                </div>
            </div>

            <!-- 编辑器容器 -->
            <div class="editor-container" id="editorContainer">
                <div class="editor-placeholder" id="editorPlaceholder">
                    <p>请从左侧选择文件进行查看/编辑</p>
                    <p class="hint">支持的文件类型：CSV, JSON, YAML, INI, TXT, PY, MD 等文本文件</p>
                </div>
                <div id="aceEditor" style="display:none; height:100%;"></div>
            </div>

            <!-- 底部操作栏 -->
            <div class="action-bar">
                <button id="saveBtn" class="btn btn-primary" disabled>保存 (Ctrl+S)</button>
                <button id="reloadBtn" class="btn btn-secondary" disabled>重新加载</button>
                <span class="save-status" id="saveStatus"></span>
            </div>
        </main>
    </div>

    <!-- 消息提示 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Ace Editor -->
    <script src="{{ url_for('static', filename='lib/ace/ace.js') }}"></script>
    <script src="{{ url_for('static', filename='lib/ace/mode-text.js') }}"></script>
    <script src="{{ url_for('static', filename='lib/ace/mode-json.js') }}"></script>
    <script src="{{ url_for('static', filename='lib/ace/mode-xml.js') }}"></script>
    <script src="{{ url_for('static', filename='lib/ace/theme-monokai.js') }}"></script>
    <!-- 主逻辑 -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
