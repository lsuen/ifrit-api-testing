<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}控制台{% endblock %} · ifrit 接口自动化平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/platform.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="platform-body {% block body_class %}{% endblock %}">
{% block layout %}
<div class="app-shell">
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>
    <aside class="sidebar" id="appSidebar">
        <div class="brand">
            <a class="brand-logo" href="/">
                <i class="bi bi-lightning-charge-fill"></i>
                <span>ifrit 测试平台</span>
            </a>
            <div class="brand-sub">API 自动化 · AI 用例 · 报告</div>
        </div>
        <nav class="nav-menu">
            <div class="nav-section-title">新手入门</div>
            <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="/">
                <i class="bi bi-grid-1x2"></i> 仪表盘
            </a>
            <a class="nav-link {% if request.endpoint == 'settings_page' %}active{% endif %}" href="/settings">
                <i class="bi bi-gear"></i> 设置
            </a>
            <div class="nav-section-title mt-3">测试流程</div>
            <a class="nav-link {% if request.endpoint == 'import_page' %}active{% endif %}" href="/import">
                <i class="bi bi-1-circle"></i> 导入用例
            </a>
            <a class="nav-link {% if request.endpoint == 'ai_page' %}active{% endif %}" href="/ai">
                <i class="bi bi-2-circle"></i> AI 生成
            </a>
            <a class="nav-link {% if request.endpoint == 'execute_page' %}active{% endif %}" href="/execute">
                <i class="bi bi-3-circle"></i> 执行测试
            </a>
            <a class="nav-link {% if request.endpoint == 'reports_page' %}active{% endif %}" href="/reports">
                <i class="bi bi-4-circle"></i> 查看报告
            </a>
            <div class="nav-section-title mt-3">进阶</div>
            <a class="nav-link {% if request.endpoint == 'agent_page' %}active{% endif %}" href="/agent">
                <i class="bi bi-robot"></i> Agent 对话
            </a>
            <a class="nav-link {% if request.endpoint == 'knowledge_page' %}active{% endif %}" href="/knowledge">
                <i class="bi bi-database"></i> 知识库
            </a>
            <a class="nav-link {% if request.endpoint == 'skills_page' %}active{% endif %}" href="/skills">
                <i class="bi bi-puzzle"></i> Skill 管理
            </a>
            <a class="nav-link {% if request.endpoint == 'about_page' %}active{% endif %}" href="/about">
                <i class="bi bi-info-circle"></i> 关于
            </a>
            <div class="nav-section-title mt-3">高级</div>
            <a class="nav-link {% if request.endpoint == 'console_page' %}active{% endif %}" href="/console">
                <i class="bi bi-terminal"></i> 控制台
            </a>
            <a class="nav-link {% if request.endpoint == 'advanced_page' %}active{% endif %}" href="/advanced">
                <i class="bi bi-code-square"></i> 文件编辑
            </a>
        </nav>
        <div class="sidebar-footer">
            <span class="status-dot"></span>服务运行中 · <a href="/about" class="sidebar-version-link">v0.3</a>
        </div>
    </aside>
    <div class="main-wrap flex-grow-1 d-flex flex-column min-vh-100">
        <header class="mobile-topbar">
            <button type="button" class="btn btn-sm btn-outline-light" id="sidebarToggle" aria-label="打开菜单">
                <i class="bi bi-list"></i>
            </button>
            <span class="fw-semibold">ifrit 测试平台</span>
            <span style="width:2rem;"></span>
        </header>
        <main class="main-content flex-grow-1">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="{{ url_for('static', filename='js/platform.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
