<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}控制台{% endblock %} · ifrit 接口自动化平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/platform.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="platform-body {% block body_class %}{% endblock %}">
{% block layout %}
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <a class="brand-logo" href="/">
                <i class="bi bi-lightning-charge-fill"></i>
                <span>ifrit 测试平台</span>
            </a>
            <div class="brand-sub">API 自动化 · AI 用例 · 报告</div>
        </div>
        <nav class="nav-menu">
            <div class="nav-section-title">工作台</div>
            <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="/">
                <i class="bi bi-grid-1x2"></i> 仪表盘
            </a>
            <a class="nav-link {% if request.endpoint == 'execute_page' %}active{% endif %}" href="/execute">
                <i class="bi bi-play-circle"></i> 执行测试
            </a>
            <a class="nav-link {% if request.endpoint == 'ai_page' %}active{% endif %}" href="/ai">
                <i class="bi bi-stars"></i> AI 实验室
            </a>
            <a class="nav-link {% if request.endpoint == 'reports_page' %}active{% endif %}" href="/reports">
                <i class="bi bi-graph-up"></i> 报告中心
            </a>
            <div class="nav-section-title mt-3">高级</div>
            <a class="nav-link {% if request.endpoint == 'advanced_page' %}active{% endif %}" href="/advanced">
                <i class="bi bi-code-square"></i> 文件编辑
            </a>
        </nav>
        <div class="sidebar-footer">
            <span class="status-dot"></span>服务运行中 · v2.0
        </div>
    </aside>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</div>
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="{{ url_for('static', filename='js/platform.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
