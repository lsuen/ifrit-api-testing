[auth]
enabled = true
auto_login = false

[login]
path = /api/login
method = POST
headers = {"Content-Type": "application/json"}
body = {"username": "main", "password": "123456"}
expected_status = 200

[token]
extract = json.token
variable = token

[header]
name = Authorization
template = Bearer {{token}}

[body_auth]
username_field = username
token_field = token
username_value = main

[discovery]
api_doc = api_docs/apispec_1.json
login_path_hint = /api/login

