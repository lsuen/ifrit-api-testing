# CLI 命令声明（与 main.py 参数对齐）

test_run:
  description: "执行测试用例"
  template: "{python} {script} {args}"

ai_generate:
  description: "AI 生成测试用例"
  template: "{python} {script} --ai-generate {args}"

ai_chat:
  description: "AI 交互模式"
  template: "{python} {script} --chat {args}"

generate_report:
  description: "生成 HTML 报告"
  template: "{python} {script} --generate-report"

serve_report:
  description: "启动 Allure 报告服务"
  template: "{python} {script} --serve-report"

clean:
  description: "清理日志或报告"
  template: "{python} {script} --clean {target} {extra}"
