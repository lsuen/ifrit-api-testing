[logging]
level = INFO
daily_logs_enabled = true
error_daily_logs_enabled = true
# 是否写入 logs/api_automation.log（与 daily 重复，默认关闭）
main_log_enabled = false

[retention]
# 日志/报告保留天数（0 表示不按天数删）
logs_keep_days = 14
reports_keep_days = 7
# 至少保留最近 N 次报告 run（0 表示不限制条数，仅按天数）
reports_keep_last = 20
# 每次跑测试前自动清理过期产物
auto_clean_before_run = false
