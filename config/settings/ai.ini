[openai]
base_url = https://llm.nnrc.ren/v1
model = openai/gpt-oss-120b
temperature = 0.7
max_tokens = 2000
timeout = 120

[generation]
positive_cases_count = 1
negative_cases_count = 1
boundary_cases_count = 1
structure_cases_count = 1
path_cases_count = 1
include_auth_cases = false

[prompts]
system_prompt = 你是一个专业的API测试工程师，需要根据接口文档生成全面的测试用例。请严格按照指定的JSON格式返回测试用例数据。
positive_template = 为以下接口生成正向测试用例，确保正常场景下的功能验证
negative_template = 为以下接口生成反向测试用例，包括参数错误、权限不足等异常场景
boundary_template = 为以下接口生成边界测试用例，包括最大值、最小值、空值等边界条件

[output]
default_output_dir = fixtures/ai/csv
add_timestamp = true
file_prefix = ai_
quality_check = true
conflict_resolution = overwrite

