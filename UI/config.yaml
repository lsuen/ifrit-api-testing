# ifrit-apitest Web UI 配置文件
ifrit:
  root_path: "../"
  python_bin: "python"
  cli_script: "main.py"

server:
  host: "0.0.0.0"
  port: 5001
  debug: false

paths:
  fixtures: "fixtures"
  reports_runs: "reports/runs"
  reports_latest: "reports/latest.txt"
  logs: "logs"
  api_docs: "api_docs"
  config: "config/settings"

presets:
  smoke_file: "fixtures/smoke/csv/api_test_smoke.csv"
  ai_business_file: "fixtures/ai/csv/ai_address_business.csv"
